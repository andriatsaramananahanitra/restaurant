apiVersion: apps/v1
kind: ReplicaSet

metadata:
  name: restaurant
  namespace: restaurant

spec:

  replicas: 2

  selector:
    matchLabels:
      app: restaurant

  template:

    metadata:
      labels:
        app: restaurant

    spec:

      containers:

        - name: nginx

          image: restaurant:1.0

          imagePullPolicy: Never

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /healthz
              port: 80

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /healthz
              port: 80

            initialDelaySeconds: 10
            periodSeconds: 20
